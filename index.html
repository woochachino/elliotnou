<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 400;
      color: #222;
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
    }

    #canvas-container {
      width: 350px;
      height: 350px;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
    }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #999;
    }
  </style>
</head>
<body>

  <h1>Hi, I'm Elliot</h1>
  
  <div id="canvas-container"></div>
  
  <p class="hint">drag to rotate</p>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // Setup
    const container = document.getElementById('canvas-container');
    const width = 350;
    const height = 350;

    // Scene
    const scene = new THREE.Scene();

    // Camera
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.z = 3;

    // Renderer with transparent background
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true, 
      alpha: true 
    });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);

    const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
    backLight.position.set(-5, -5, -5);
    scene.add(backLight);

    // Orbit controls for drag rotation
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.rotateSpeed = 0.8;

    // Raycaster for click detection
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Define which object names link to which pages
    // These names must match your object names in Blender
    const clickableLinks = {
      'About': '/about.html',
      'Projects': '/projects.html',
      'Contact': '/contact.html',
      // Add more: 'ObjectName': '/page.html'
    };

    let model;

    // Load your 3D model
    const loader = new GLTFLoader();
    
    loader.load(
      'model.glb',
      (gltf) => {
        model = gltf.scene;
        
        // Center the model
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);
        
        // Scale to fit nicely
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2 / maxDim;
        model.scale.multiplyScalar(scale);
        
        scene.add(model);

        // Log all object names so you know what to use
        console.log('Objects in your model:');
        model.traverse((child) => {
          if (child.isMesh) {
            console.log(' -', child.name);
          }
        });
      },
      (progress) => {
        console.log('Loading...', (progress.loaded / progress.total * 100) + '%');
      },
      (error) => {
        console.error('Error loading model:', error);
      }
    );

    // Track mouse state to distinguish clicks from drags
    let mouseDownTime = 0;
    let mouseDownPos = { x: 0, y: 0 };
    const clickThresholdTime = 200; // max ms for a click
    const clickThresholdDist = 5;   // max pixels moved for a click

    function onMouseDown(event) {
      mouseDownTime = Date.now();
      mouseDownPos = { x: event.clientX, y: event.clientY };
    }

    function onMouseUp(event) {
      if (!model) return;

      const timeDiff = Date.now() - mouseDownTime;
      const distMoved = Math.sqrt(
        Math.pow(event.clientX - mouseDownPos.x, 2) +
        Math.pow(event.clientY - mouseDownPos.y, 2)
      );

      // Only register as click if quick and didn't move much
      if (timeDiff > clickThresholdTime || distMoved > clickThresholdDist) {
        return; // It was a drag, not a click
      }

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      
      const intersects = raycaster.intersectObjects(model.children, true);

      if (intersects.length > 0) {
        const clickedObject = intersects[0].object;
        console.log('Clicked:', clickedObject.name);

        const link = clickableLinks[clickedObject.name];
        if (link) {
          window.location.href = link;
        }
      }
    }

    // Handle hover cursor
    function onMouseMove(event) {
      if (!model) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      
      const intersects = raycaster.intersectObjects(model.children, true);

      if (intersects.length > 0) {
        const hoveredName = intersects[0].object.name;
        if (clickableLinks[hoveredName]) {
          container.style.cursor = 'pointer';
          return;
        }
      }
      container.style.cursor = 'grab';
    }

    renderer.domElement.addEventListener('mousedown', onMouseDown);
    renderer.domElement.addEventListener('mouseup', onMouseUp);
    renderer.domElement.addEventListener('mousemove', onMouseMove);

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>

</body>
</html>
